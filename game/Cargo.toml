[package]
name = "game"
version = "0.1.0"
edition = "2021"
description = "The tech demo: a battle from the simulation played back with the game's pixel art."

[features]
default = ["window", "audio"]
# The window (winit + pixels). Without it the demo still renders frames to PNG files (`--shot`, `--strip`).
window = ["dep:pixels", "dep:winit"]
# Sound (kira). On Linux building it needs the ALSA headers (libasound2-dev).
audio = ["dep:kira"]

[dependencies]
sim = { path = "../sim" }
png = "0.17"
serde_json = "1"
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
kira = { version = "0.12", optional = true, default-features = false, features = ["cpal", "ogg", "vorbis"] }
