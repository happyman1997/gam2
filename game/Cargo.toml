[package]
name = "game"
version = "0.1.0"
edition = "2021"
description = "The tech demo: a battle from the simulation played back with the game's pixel art."

[features]
default = ["window"]
# The window (winit + pixels). Without it the demo still renders frames to PNG files (`--shot`, `--strip`).
window = ["dep:pixels", "dep:winit"]

[dependencies]
sim = { path = "../sim" }
png = "0.17"
serde_json = "1"
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
